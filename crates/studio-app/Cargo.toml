[package]
name = "tuning-studio-app"
version = "0.1.2"
description = "The studio backend as plain methods: ELF browsing, session control, tuning"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
authors.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mcap = { version = "0.25", default-features = false, features = ["zstd"] }
object = { workspace = true }
ryu = "1"
serde = { workspace = true }
serde_json = { workspace = true }
studio-carriers = { package = "tuning-studio-carriers", path = "../studio-carriers", version = "0.1.2" }
studio-core = { package = "tuning-studio-core", path = "../studio-core", version = "0.1.2" }
studio-dwarf = { package = "tuning-studio-dwarf", path = "../studio-dwarf", version = "0.1.2" }
tracing = { workspace = true }

[dev-dependencies]
socket2 = "0.6"
tempfile = "3"

[lib]
name = "studio_app"
