[package]
name = "tuning-studio-server"
version = "0.1.3"
description = "The studio backend over stdio, for the VS Code extension"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
authors.workspace = true
include = ["src/**", "frontend/**", "tests/**", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

[[bin]]
name = "studio-server"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/studio-server-{ version }-{ target }.tar.zst"
pkg-fmt = "tzstd"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
studio-app = { package = "tuning-studio-app", path = "../studio-app", version = "0.1.3" }
studio-carriers = { package = "tuning-studio-carriers", path = "../studio-carriers", version = "0.1.3" }
studio-core = { package = "tuning-studio-core", path = "../studio-core", version = "0.1.3" }
studio-dwarf = { package = "tuning-studio-dwarf", path = "../studio-dwarf", version = "0.1.3" }

axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
include_dir = "0.7"
open = "5"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tungstenite = "0.30"
