[package]
name = "tuning-studio-cli"
description = "Inspect, sample and tune embedded firmware from the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tuning-studio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
probe-rs = "0.32"
probe-rs-target = "0.32"
tuning-studio-dwarf = { path = "../studio-dwarf" }

[dev-dependencies]
object = { workspace = true }
