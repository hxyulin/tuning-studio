[package]
name = "tuning-studio-cli"
description = "Inspect, sample and tune embedded firmware from the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tuning-studio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
defmt-decoder = "1"
# The version probe-rs-tools 0.32.0 pins for the GDB server in src/gdb.
gdbstub = "=0.7.8"
itertools = "0.15"
libc = "0.2"
parking_lot = "0.12"
probe-rs = "0.32"
probe-rs-target = "0.32"
serde = { workspace = true }
serde_json = { workspace = true }
shlex = "1.3"
tracing = { workspace = true }
tuning-studio-dwarf = { path = "../studio-dwarf" }

[dev-dependencies]
object = { workspace = true }
