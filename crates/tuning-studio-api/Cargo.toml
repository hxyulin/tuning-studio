[package]
name = "tuning-studio-api"
description = "Values a host can read and parameters it can tune safely, for Tuning Studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
authors.workspace = true
keywords = ["embedded", "no-std", "debugging", "tuning"]
categories = ["embedded", "no-std"]

[features]
default = ["derive"]
# `#[derive(Watchable)]`
derive = ["dep:tuning-studio-api-macros"]
# Embassy 0.10 trace hooks and task profiling. One hook implementation per binary.
embassy = ["dep:embassy-executor"]

[dependencies]
critical-section = "1.2"
embassy-executor = { version = "0.10", default-features = false, features = ["trace"], optional = true }
tuning-studio-api-macros = { path = "../tuning-studio-api-macros", optional = true }

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
