[package]
name = "tuning-studio-desktop"
description = "Native Live Watch and tuning app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
rfd = "0.16"
serde = { workspace = true }
serde_json = "1"
tuning-studio-cli = { version = "=0.2.0-rc.1", path = "../tuning-studio-cli" }
