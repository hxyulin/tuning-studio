[package]
name = "tuning-studio-carriers"
version = "0.1.3"
description = "Target memory and byte-stream carriers: probe-rs over SWD, RTT, USB serial, mock"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
authors.workspace = true

[dependencies]
libc = "0.2"
serde_json = { workspace = true }
libloading = "0.9"
probe-rs = "0.32"
probe-rs-target = "0.32"
serialport = "4.10"
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Same crate probe-rs opens CMSIS-DAP v1 probes with; see `probe::init_hid_on_main_thread`
[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6", default-features = false }

[lib]
name = "studio_carriers"
