[package]
name = "select-lab"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# Standalone firmware, not part of the host workspace.
[workspace]

[features]
plot-demo = []
profiling = ["tuning-studio-api/embassy"]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1"
embassy-sync = "0.8"
libm = "0.2"
tuning-studio-api = { version = "=0.2.0-rc.1", path = "../../crates/tuning-studio-api" }

[profile.release]
debug = 2
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
