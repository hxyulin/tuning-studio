[package]
name = "tuning-studio"
version = "0.1.3"
description = "Live variable inspection, tuning and telemetry for embedded firmware"
authors = ["hxyulin <hxyulin@proton.me>"]
edition = "2021"
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "build.rs", "Cargo.toml", "Cargo.lock", "tauri.conf.json", "capabilities/**", "icons/**", "frontend/**", "README.md", "LICENSE"]

[[bin]]
name = "tuning-studio"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.zst"
pkg-fmt = "tzstd"
bin-dir = "{ bin }{ binary-ext }"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tuning_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
studio-dwarf = { package = "tuning-studio-dwarf", path = "../crates/studio-dwarf", version = "0.1.3" }
studio-carriers = { package = "tuning-studio-carriers", path = "../crates/studio-carriers", version = "0.1.3" }
studio-core = { package = "tuning-studio-core", path = "../crates/studio-core", version = "0.1.3" }
studio-app = { package = "tuning-studio-app", path = "../crates/studio-app", version = "0.1.3" }
tauri-plugin-dialog = "2"


